name: Update README

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest repos and update README
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests
          import os

          token = os.getenv("GITHUB_TOKEN")
          headers = {"Authorization": f"Bearer {token}"} if token else {}

          url = "https://api.github.com/user/repos?sort=pushed&per_page=20&visibility=all&affiliation=owner"
          resp = requests.get(url, headers=headers)

          if resp.status_code != 200:
              print(f"Error fetching repos: {resp.status_code} - {resp.text}")
              exit(1)

          repos = resp.json()
          
          # Repositories to exclude from the list
          ignored_repos = {"callenflynn", "server-heartbeat"}

          # Filter out forks and ignored repositories
          filtered_repos = [
              r for r in repos 
              if not r.get("fork") and r.get("name") not in ignored_repos
          ]

          new_lines = []
          new_lines.append('<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;">\n')

          for repo in filtered_repos[:4]:
              name = repo.get("name")
              url = repo.get("html_url")
              # Theme parameters applied: #050505 background, #FF3B00 title/icons, #E0E0E0 text
              img_src = f"https://gh-readme-stats.vercel.app/api/pin/?username=callenflynn&repo={name}&bg_color=050505&title_color=FF3B00&text_color=E0E0E0&icon_color=FF3B00&border_color=30363d"
              new_lines.append(f'  <a href="{url}"><img src="{img_src}" alt="{name}" /></a>\n')

          new_lines.append('</div>\n')

          with open("README.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          output = []
          inside = False
          found_start = False
          found_end = False

          for line in lines:
              if "<!-- REPOS_START -->" in line:
                  inside = True
                  found_start = True
                  output.append(line)
                  output.extend(new_lines)
                  continue

              if "<!-- REPOS_END -->" in line:
                  inside = False
                  found_end = True
                  output.append(line)
                  continue

              if not inside:
                  output.append(line)

          if not (found_start and found_end):
              print("ERROR: Missing <!-- REPOS_START --> or <!-- REPOS_END --> in README.md")
              exit(1)

          with open("README.md", "w", encoding="utf-8") as f:
              f.writelines(output)

          print("README successfully updated.")
          EOF

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update README with latest projects"
          file_pattern: "README.md"
